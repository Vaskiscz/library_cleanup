<script>
  (function () {
    var site = document.currentScript.closest('.site');
    var page = site && site.getAttribute('data-page');
    var top = document.querySelector('.vt-top');
    // iPhone and iPad (iPadOS reports itself as a Mac, but with touch).
    var ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) document.documentElement.classList.add('vt-ios');
    // Current page link.
    var cur = top.querySelector('.vt-nav a[data-nav="' + page + '"]');
    if (cur) cur.setAttribute('aria-current', 'page');
    // Phone menu.
    var btn = top.querySelector('.vt-burger');
    function setOpen(open) {
      top.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }
    btn.addEventListener('click', function () { setOpen(!top.classList.contains('open')); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && top.classList.contains('open')) { setOpen(false); btn.focus(); } });
    document.addEventListener('click', function (e) { if (top.classList.contains('open') && !top.contains(e.target)) setOpen(false); });
    top.querySelectorAll('.vt-nav a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
    // Bottom bar: shown once the visitor has scrolled, and only while no other
    // download button (data-cta-anchor) and not the footer is on screen.
    var bar = site && site.querySelector(page === 'selects' ? '.vt-bar-selects' : page === 'library-cleanup' ? '.vt-bar-lc' : null);
    if (!bar || !('IntersectionObserver' in window)) return;
    var visible = new Set(), scrolled = false;
    function update() {
      var show = scrolled && visible.size === 0;
      bar.classList.toggle('show', show);
      bar.setAttribute('aria-hidden', show ? 'false' : 'true');
      bar.querySelectorAll('a').forEach(function (a) { a.tabIndex = show ? 0 : -1; });
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) visible.add(en.target); else visible.delete(en.target); });
      update();
    });
    document.addEventListener('DOMContentLoaded', function () {
      site.querySelectorAll('[data-cta-anchor], footer').forEach(function (el) { io.observe(el); });
    });
    addEventListener('scroll', function () { var s = scrollY > 240; if (s !== scrolled) { scrolled = s; update(); } }, { passive: true });
  })();
</script>
