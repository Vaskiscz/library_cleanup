# Netlify config for the vaclavtrnka.cz static site.
# The site is plain HTML — no build step. Publish this folder as-is.

[build]
  publish = "."
  command = ""

# One function: /api/selects-rating (netlify/functions/selects-rating.mjs),
# the worldwide App Store rating and live version, summed from Apple's public
# per-storefront lookup and cached on Netlify's CDN for a day. It needs no
# build step and no dependencies. See partials/asc-sync.html in the source
# for the page side.
[functions]
  directory = "netlify/functions"

# The function's source sits inside the published folder (publish = "."), so
# keep it from being served as a static file.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

# Long-cache the SVG favicons (they rarely change).
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Long-cache raster images (OG cards, screenshots, app icons).
#
# Two different caches bite here, and they need different answers.
#
# Ordinary <img> assets are fine to replace in place. They ride this 7-day
# cache, but HTML is max-age=0, must-revalidate, so a page load re-fetches
# anything whose bytes changed.
#
# FAVICONS AND APPLE TOUCH ICONS ARE NOT ORDINARY ASSETS. Browsers keep them in
# their own persistent icon store, separate from the HTTP cache and refreshed
# lazily, so a replaced favicon can keep showing the old art for days after the
# page itself has updated. No header fixes that, because the browser is not
# asking. Only a new URL does.
#
# So those two filenames carry a version: favicon-v3.png,
# apple-touch-icon-v3.png (Selects; v3 since the 2026-11-06 icon). When the
# art changes, bump the suffix and update every heads/selects*.html rather
# than overwriting. The in-page /selects/app-icon-v2.png is versioned too:
# under the 7-day cache below, a replaced <img> can also show old art to a
# returning visitor for up to a week.
#
# Learned the hard way: the Selects favicon kept serving the old Library Cleanup
# art after the icon was replaced in place, while every <img> on the page had
# already updated correctly.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/selects/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
