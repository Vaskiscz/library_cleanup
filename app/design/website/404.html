<style>
  :root{
    --bg:#0f1114; --line:#262b33; --line-2:#343a44;
    --text:#eef0f3; --text-2:#a3a9b3; --text-3:#6c737e;
    --accent:#e6a93a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Helvetica,sans-serif;
  }
  .site{font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.6; font-size:17px; min-height:100vh; display:flex; flex-direction:column;}
  .site *{box-sizing:border-box;}
  .wrap{max-width:680px; margin:0 auto; padding:0 28px; width:100%;}
  main{flex:1; display:flex; align-items:center; padding:72px 0;}
  .box{text-align:center;}
  .box h1{font-size:clamp(56px,10vw,80px); font-weight:700; letter-spacing:-.04em; line-height:1; margin:0 0 16px;}
  .box p{color:var(--text-2); margin:0 0 28px;}
  .box nav{display:flex; gap:10px 22px; justify-content:center; flex-wrap:wrap; font-size:15.5px;}
  .box nav a{color:var(--accent); font-weight:600; text-decoration:none;}
  .box nav a:hover{text-decoration:underline;}
  .foot{border-top:1px solid var(--line); padding:28px 0; font-size:13.5px; color:var(--text-3);}
  .foot .wrap{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .foot a{color:var(--text-2);}
  @media(max-width:520px){.wrap{padding:0 22px;}}
</style>

<div class="site" data-theme="dark" data-page="notfound">
  <!--#include header-->

  <main>
    <div class="wrap box">
      <h1>404</h1>
      <p>This page doesn't exist (or moved). The rest of the site is still here:</p>
      <nav>
        <a href="/">Home</a>
        <a href="/library-cleanup/">Library Cleanup</a>
        <a href="/selects/">Selects</a>
      </nav>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>© 2026 · vaclavtrnka.cz</span>
      <!--#include operator-->
    </div>
  </footer>
</div>
